<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Barts — San Paolo</title>
  <meta name="description" content="Apresentação imersiva Casa Barts — Edifício San Paolo, Faria Lima.">
  <meta property="og:title" content="Casa Barts — San Paolo">
  <meta property="og:description" content="Casa Barts no Edifício San Paolo, Faria Lima.">
  <meta property="og:image" content="assets/hero/san-paolo-facade.jpg">
  <meta name="theme-color" content="#E8E6E1">
  <meta name="color-scheme" content="light">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="experience" aria-label="Apresentação imersiva Casa Barts San Paolo">

    <div class="canvas" aria-hidden="true">
      <div class="canvas-layer canvas-layer--base">
        <img
          id="canvas-base"
          src="assets/hero/san-paolo-facade.jpg"
          alt=""
          fetchpriority="high"
        >
      </div>
      <div class="canvas-layer canvas-layer--active" id="canvas-active">
        <img id="canvas-img" src="" alt="">
      </div>
      <div class="canvas-shimmer"></div>
      <div class="canvas-vignette"></div>
    </div>

    <div class="floor-plan-stage" aria-hidden="true">
      <figure class="floor-plan-full">
        <div class="floor-plan-frame">
          <img
            src="assets/floor-plan/niveis.svg"
            alt="Planta isométrica — andares 20, 21 e 22"
            width="626"
            height="680"
          >
          <div id="floor-plan-hotspots" class="floor-plan-hotspots"></div>
        </div>
      </figure>
    </div>

    <aside class="glass-directory" aria-label="Espaços Casa Barts">
      <header class="directory-brand">
        <img
          class="brand-logo"
          src="assets/brand/casa-barts-logo.svg"
          alt="Casa Barts"
          width="200"
          height="38"
        >
        <div class="brand-bar" aria-hidden="true"></div>
        <p class="brand-subline">San Paolo</p>
      </header>

      <nav class="space-nav" id="space-nav" aria-label="Lista de espaços"></nav>

      <p class="directory-hint">Passe o cursor sobre um espaço · clique para ver fotos</p>
    </aside>

    <div class="glass-idle" id="glass-idle">
      <p class="idle-eyebrow">Edifício San Paolo · Faria Lima</p>
      <h1 class="idle-title">Casa Barts<br>San Paolo</h1>
    </div>

    <footer class="experience-footer">
      <span>9 microespaços</span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span>Cipriani · Dior · Zegna · Taschen · Casa Barts</span>
    </footer>

  </main>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lightbox-title"
    hidden
  >
    <div class="lightbox-backdrop" id="lightbox-backdrop" tabindex="-1"></div>
    <div class="lightbox-panel">
      <div class="lightbox-carousel" id="lightbox-carousel">
        <div class="lightbox-slides" id="lightbox-slides"></div>

        <header class="lightbox-caption">
          <p class="lightbox-category" id="lightbox-category"></p>
          <h2 class="lightbox-title" id="lightbox-title"></h2>
        </header>

        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Fechar galeria">×</button>
        <button type="button" class="lightbox-arrow lightbox-arrow--prev" id="lightbox-prev" aria-label="Foto anterior">‹</button>
        <button type="button" class="lightbox-arrow lightbox-arrow--next" id="lightbox-next" aria-label="Próxima foto">›</button>
        <nav class="lightbox-dots" id="lightbox-dots" aria-label="Navegação de fotos"></nav>
      </div>

      <p class="lightbox-live sr-only" id="lightbox-live" aria-live="polite"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
